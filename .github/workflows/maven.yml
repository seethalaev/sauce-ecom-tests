name: Maven CI/CD Test Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # This event allows manual triggering from the GitHub Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest  # GitHub's Linux runner

    steps:
    - uses: actions/checkout@v4
    
    # Setup Java Environment
    # FIX: Updated JDK from 1.8 to 11 to resolve the compilation error 
    # (class file version 55.0 incompatible with 52.0). Selenium 4.x often requires JDK 11+.
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
        
    # Run the Maven test goal
    - name: Run Maven Tests (Selenium)
      run: mvn -B test --file pom.xml
      
    # (Optional) Archive test results for detailed viewing
    - name: Archive Test Results
      if: always() # Run even if tests fail
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: target/surefire-reports
